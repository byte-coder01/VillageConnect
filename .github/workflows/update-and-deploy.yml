name: Update notices and deploy VillageConnect

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/notices.json'
      - 'data/notice-sources.json'
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install notice scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Fetch official government notices
        run: python scripts/fetch_notices.py

      - name: Persist refreshed notice data and discovered sources
        run: |
          if git diff --quiet -- data/notices.json data/notice-sources.json; then
            echo "Notice data and source registry are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/notice-sources.json
          git commit -m "Refresh official government notice index"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R *.html *.css *.js favicon.svg data _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
